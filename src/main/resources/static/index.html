<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>My Notes</title>

    <link
            rel="stylesheet"
            href="/css/notes.css">

</head>


<body>


<div class="notes-app">


    <!-- =====================================
         LEFT SIDEBAR
    ====================================== -->

    <aside class="sidebar">


        <div class="sidebar-header">

            <div class="app-title">

                <span class="app-icon">📝</span>

                <span>My Notes</span>

            </div>


            <button
                    id="newNoteButton"
                    class="new-note-button">

                <span>+</span>

                New Note

            </button>

        </div>


        <!-- Search -->

        <div class="search-container">

            <input
                    id="searchInput"
                    type="text"
                    placeholder="Search notes...">

        </div>


        <!-- Notes -->

        <div
                id="notesList"
                class="notes-list">

        </div>


        <!-- Sidebar bottom -->

        <div class="sidebar-footer">

            <span id="notesCount">
                0 notes
            </span>

        </div>


    </aside>



    <!-- =====================================
         MAIN EDITOR
    ====================================== -->

    <main class="editor-area">


        <!-- EMPTY STATE -->

        <div
                id="emptyState"
                class="empty-state">

            <div class="empty-icon">
                📝
            </div>

            <h2>
                Select a note
            </h2>

            <p>
                Select a note from the left
                or create a new note.
            </p>

            <button
                    id="emptyNewButton"
                    class="empty-new-button">

                + Create New Note

            </button>

        </div>



        <!-- EDITOR -->

        <div
                id="editor"
                class="editor hidden">


            <!-- EDITOR TOP -->

            <div class="editor-top">


                <div
                        id="saveStatus"
                        class="save-status">

                    Saved

                </div>


                <button
                        id="deleteButton"
                        class="delete-button">

                    🗑 Delete

                </button>

            </div>


            <!-- TITLE -->

            <input
                    id="noteTitle"
                    class="note-title"
                    type="text"
                    placeholder="Untitled Note"
                    autocomplete="off">


            <!-- CONTENT -->

            <textarea
                    id="noteContent"
                    class="note-content"
                    placeholder="Start writing..."></textarea>


        </div>


    </main>


</div>


<script src="/js/notes.js"></script>

</body>

</html>
