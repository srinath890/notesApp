<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Notes</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-card">

        <h1>My Notes</h1>

        <p class="subtitle">
            Login to your account
        </p>

        <form id="loginForm">

            <label>
                Username
            </label>

            <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
            >

            <label>
                Password
            </label>

            <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p class="auth-link">
            Don't have an account?
            <a href="/register.html">
                Create account
            </a>
        </p>

    </div>

</div>

<script src="/js/login.js"></script>

</body>

</html>
